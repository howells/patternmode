name: Validate Package Alignment

on:
  push:
    branches: [main, develop]
    paths: ['**/package.json']
  pull_request:
    branches: [main, develop]
    paths: ['**/package.json']

jobs:
  validate-packages:
    name: Validate Package.json Alignment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package alignment
        run: pnpm validate-packages

      - name: Run linting on package.json files
        run: pnpm lint -- "**/*.json"