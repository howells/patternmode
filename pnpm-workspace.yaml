packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
overrides:
  postcss: ^8.5.15
minimumReleaseAgeExclude:
  # First-party scopes are exempt BY NAME, never by version. We publish these
  # ourselves, so a release-age gate only delays our own work — and a per-version
  # entry silently expires the moment we ship the next one. Never add
  # `@scope/pkg@x.y.z` for one of ours; the name covers every future release.
  - "@howells/*"
  - "@instruments/*"
  - "@patternmode/*"
  # Third-party pins below are per-version on purpose: they are transient
  # unblocks for a specific release, and should lapse rather than persist.
  - "@next/env@16.3.4"
  - "@next/swc-darwin-arm64@16.3.4"
  - "@next/swc-darwin-x64@16.3.4"
  - "@next/swc-linux-arm64-gnu@16.3.4"
  - "@next/swc-linux-arm64-musl@16.3.4"
  - "@next/swc-linux-x64-gnu@16.3.4"
  - "@next/swc-linux-x64-musl@16.3.4"
  - "@next/swc-win32-arm64-msvc@16.3.4"
  - "@next/swc-win32-x64-msvc@16.3.4"
  - "@turbo/darwin-64@2.9.17"
  - "@turbo/darwin-arm64@2.9.17"
  - "@turbo/linux-64@2.9.17"
  - "@turbo/linux-arm64@2.9.17"
  - "@turbo/windows-64@2.9.17"
  - "@turbo/windows-arm64@2.9.17"
  - "next@16.3.4"
  - "turbo@2.9.17"
catalog:
  "@howells/envy": "0.3.7"
  "@howells/husky": "0.2.3"
  "@howells/lint": "^3.3.2"
  "@howells/typescript-config": "0.1.6"
  "@base-ui/react": "^1.6.0"
  "@types/node": "26.4.1"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.7"
  "@vitest/browser": "5.0.0"
  "@vitest/browser-playwright": "5.0.0"
  "jsdom": "30.0.1"
  "lucide-react": "^1.17.0"
  "lint-staged": "17.5.0"
  "motion": "^13.2.0"
  "next": "16.3.4"
  "playwright": "1.63.0"
  "react": "^19.2.7"
  "react-dom": "^19.2.7"
  "tailwindcss": "4.3.3"
  "turbo": "2.10.12"
  "typescript": "7.0.2"
  "vitest": "5.0.0"
  "vitest-browser-react": "2.3.0"
  "zod": "^4.4.3"
