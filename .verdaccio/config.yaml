store:
  storage: ./.verdaccio/storage
  database: ./.verdaccio/storage/database.json

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@patternmode/*':
    access: $all
    publish: $all
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

logs:
  - { type: stdout, format: pretty, level: http }

server:
  keepAliveTimeout: 60

